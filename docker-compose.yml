services:
  mysql:
    image: mysql:8.4
    container_name: mysql-seguridad
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: empresa_seguridad
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/empresa_seguridad.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: